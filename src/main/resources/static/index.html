<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL 단축기</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5f6b7a;
      --border: #dde1e6;
      --accent: #2f6fed;
      --accent-text: #ffffff;
      --ok-bg: #eaf6ee;
      --ok-text: #1d6b3a;
      --err-bg: #fdecec;
      --err-text: #a32020;
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171b;
        --card: #1d2126;
        --text: #e6e9ed;
        --muted: #9aa5b1;
        --border: #333a42;
        --accent: #5b8cff;
        --accent-text: #0d1117;
        --ok-bg: #16301f;
        --ok-text: #7fd69b;
        --err-bg: #3a1a1a;
        --err-text: #ff9c9c;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 16px 64px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 28px; }

    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }
    h2 { font-size: 1.1rem; margin: 0 0 16px; }

    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .hint { font-weight: 400; color: var(--muted); font-size: 0.875rem; }
    .field { margin-bottom: 16px; }

    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    .key-input {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      overflow: hidden;
    }
    .key-input:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
    .key-input .prefix {
      padding: 10px 0 10px 12px;
      color: var(--muted);
      white-space: nowrap;
      font-size: 1rem;
    }
    .key-input input { border: none; border-radius: 0; padding-left: 2px; }
    .key-input input:focus { outline: none; }

    .row { display: flex; gap: 8px; }
    .row input { flex: 1; min-width: 0; }

    button {
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
      white-space: nowrap;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      word-break: break-all;
    }
    .message.ok { background: var(--ok-bg); color: var(--ok-text); }
    .message.err { background: var(--err-bg); color: var(--err-text); }
    .message a { color: inherit; font-weight: 700; }
    .message .row { margin-top: 8px; align-items: center; }

    .stats {
      margin-top: 16px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
      word-break: break-all;
    }
    .stats dt { color: var(--muted); }
    .stats dd { margin: 0; }
    .count { font-size: 2rem; font-weight: 700; line-height: 1.2; }

    ul.recent { list-style: none; margin: 0; padding: 0; }
    ul.recent li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    ul.recent li:first-child { border-top: none; }
    .recent .info { min-width: 0; }
    .recent .key { font-weight: 600; }
    .recent .orig {
      color: var(--muted);
      font-size: 0.875rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .recent button { padding: 6px 12px; font-size: 0.875rem; }
    .empty { color: var(--muted); margin: 0; }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .suggestions .hint { margin-right: 2px; }
    .chip {
      padding: 4px 12px;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 999px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .chip.selected { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>URL 단축기</h1>
  <p class="lead">긴 주소를 짧게 만들고, 몇 번 클릭됐는지 확인하세요.</p>

  <section>
    <h2>단축 URL 만들기</h2>
    <form id="create-form" novalidate>
      <div class="field">
        <label for="original-url">원본 URL</label>
        <input id="original-url" type="url" placeholder="https://www.example.com/very/long/path" required>
      </div>
      <div class="field">
        <label for="custom-key">원하는 키 <span class="hint">(선택 · 영문, 숫자, 하이픈 4~20자 · 비우면 랜덤)</span></label>
        <div class="key-input">
          <span class="prefix" id="key-prefix"></span>
          <input id="custom-key" type="text" placeholder="my-link" maxlength="20" autocomplete="off">
        </div>
        <div id="suggestions" class="suggestions" hidden>
          <span class="hint">추천:</span>
        </div>
      </div>
      <button type="submit" id="create-btn">단축하기</button>
    </form>
    <div id="create-result" class="message" hidden></div>
  </section>

  <section>
    <h2>조회수 확인</h2>
    <form id="stats-form" class="row" novalidate>
      <input id="stats-key" type="text" placeholder="키 또는 단축 URL 붙여넣기" autocomplete="off">
      <button type="submit" id="stats-btn">조회</button>
    </form>
    <div id="stats-error" class="message err" hidden></div>
    <dl id="stats-result" class="stats" hidden>
      <dt>조회수</dt><dd class="count" id="stats-count"></dd>
      <dt>단축 URL</dt><dd id="stats-short"></dd>
      <dt>원본 URL</dt><dd id="stats-original"></dd>
    </dl>
  </section>

  <section>
    <h2>내가 만든 링크 <span class="hint">(이 브라우저에만 저장됩니다)</span></h2>
    <ul id="recent-list" class="recent"></ul>
    <p id="recent-empty" class="empty">아직 만든 링크가 없습니다.</p>
  </section>
</main>

<script>
  const KEY_PATTERN = /^[a-zA-Z0-9-]{4,20}$/;
  const STORAGE_KEY = 'shortenurl.recent';
  const MAX_RECENT = 20;
  const ORIGIN = location.origin;

  const $ = (id) => document.getElementById(id);
  $('key-prefix').textContent = ORIGIN.replace(/^https?:\/\//, '') + '/';

  const shortUrlOf = (key) => `${ORIGIN}/${key}`;

  function showMessage(el, type, content) {
    el.className = 'message ' + type;
    el.replaceChildren(content);
    el.hidden = false;
  }

  function text(str) {
    return document.createTextNode(str);
  }

  async function readError(res) {
    const body = await res.text();
    try {
      const json = JSON.parse(body);
      return json.message || json.error || `요청 실패 (${res.status})`;
    } catch {
      return body || `요청 실패 (${res.status})`;
    }
  }

  $('create-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const resultEl = $('create-result');
    const originalUrl = $('original-url').value.trim();
    const customKey = $('custom-key').value.trim();

    if (!originalUrl) {
      showMessage(resultEl, 'err', text('원본 URL을 입력해 주세요.'));
      return;
    }
    if (!/^https?:\/\//i.test(originalUrl)) {
      showMessage(resultEl, 'err', text('URL은 http:// 또는 https:// 로 시작해야 합니다.'));
      return;
    }
    if (customKey && !KEY_PATTERN.test(customKey)) {
      showMessage(resultEl, 'err', text('키는 영문, 숫자, 하이픈(-)으로 4~20자여야 합니다.'));
      return;
    }

    const body = { originalUrl };
    if (customKey) body.customKey = customKey;

    const btn = $('create-btn');
    btn.disabled = true;
    try {
      const res = await fetch('/shortenUrl', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        showMessage(resultEl, 'err', text(await readError(res)));
        return;
      }
      const data = await res.json();
      showMessage(resultEl, 'ok', buildCreatedView(data.shortenUrlKey));
      saveRecent(data.shortenUrlKey, data.originalUrl);
      renderRecent();
      $('custom-key').value = '';
      requestSuggestions();
    } catch {
      showMessage(resultEl, 'err', text('서버에 연결할 수 없습니다.'));
    } finally {
      btn.disabled = false;
    }
  });

  function buildCreatedView(key) {
    const url = shortUrlOf(key);
    const wrap = document.createElement('div');
    wrap.append(text('단축 URL이 만들어졌습니다.'));

    const row = document.createElement('div');
    row.className = 'row';
    const link = document.createElement('a');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = url;
    link.style.flex = '1';

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'secondary';
    copyBtn.textContent = '복사';
    copyBtn.addEventListener('click', () => copy(url, copyBtn));

    row.append(link, copyBtn);
    wrap.append(row);
    return wrap;
  }

  async function copy(value, btn) {
    try {
      await navigator.clipboard.writeText(value);
      btn.textContent = '복사됨';
    } catch {
      btn.textContent = '복사 실패';
    }
    setTimeout(() => { btn.textContent = '복사'; }, 1500);
  }

  let suggestTimer = null;
  let suggestRequestId = 0;

  $('original-url').addEventListener('input', () => {
    clearTimeout(suggestTimer);
    suggestTimer = setTimeout(requestSuggestions, 400);
  });

  async function requestSuggestions() {
    const url = $('original-url').value.trim();
    const box = $('suggestions');
    const requestId = ++suggestRequestId;

    if (!/^https?:\/\/[^\s/]+\.[^\s/]+/i.test(url)) {
      box.hidden = true;
      return;
    }

    try {
      const res = await fetch('/shortenUrl/suggest?url=' + encodeURIComponent(url));
      if (requestId !== suggestRequestId) return;
      if (!res.ok) { box.hidden = true; return; }
      const data = await res.json();
      renderSuggestions(data.suggestions);
    } catch {
      box.hidden = true;
    }
  }

  function renderSuggestions(keys) {
    const box = $('suggestions');
    box.querySelectorAll('.chip').forEach((chip) => chip.remove());
    if (!keys || keys.length === 0) {
      box.hidden = true;
      return;
    }
    for (const key of keys) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = key;
      chip.addEventListener('click', () => {
        $('custom-key').value = key;
        markSelectedChip();
      });
      box.append(chip);
    }
    box.hidden = false;
    markSelectedChip();
  }

  function markSelectedChip() {
    const current = $('custom-key').value.trim();
    $('suggestions').querySelectorAll('.chip').forEach((chip) => {
      chip.classList.toggle('selected', chip.textContent === current);
    });
  }
  $('custom-key').addEventListener('input', markSelectedChip);

  $('stats-form').addEventListener('submit', (e) => {
    e.preventDefault();
    lookup($('stats-key').value);
  });

  function extractKey(input) {
    const value = input.trim();
    try {
      const url = new URL(value);
      return url.pathname.replace(/^\/+|\/+$/g, '');
    } catch {
      return value.replace(/^\/+|\/+$/g, '');
    }
  }

  async function lookup(input) {
    const errEl = $('stats-error');
    const resultEl = $('stats-result');
    const key = extractKey(input);
    errEl.hidden = true;
    resultEl.hidden = true;

    if (!key) {
      showMessage(errEl, 'err', text('키를 입력해 주세요.'));
      return;
    }

    const btn = $('stats-btn');
    btn.disabled = true;
    try {
      const res = await fetch('/shortenUrl/' + encodeURIComponent(key));
      if (!res.ok) {
        showMessage(errEl, 'err', text(await readError(res)));
        return;
      }
      const data = await res.json();
      $('stats-count').textContent = data.redirectCount.toLocaleString('ko-KR') + '회';
      $('stats-short').textContent = shortUrlOf(data.shortenUrlKey);
      $('stats-original').textContent = data.originalUrl;
      resultEl.hidden = false;
    } catch {
      showMessage(errEl, 'err', text('서버에 연결할 수 없습니다.'));
    } finally {
      btn.disabled = false;
    }
  }

  function loadRecent() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveRecent(key, originalUrl) {
    const list = loadRecent().filter((item) => item.key !== key);
    list.unshift({ key, originalUrl });
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0, MAX_RECENT)));
    } catch {}
  }

  function renderRecent() {
    const list = loadRecent();
    const ul = $('recent-list');
    ul.replaceChildren();
    $('recent-empty').hidden = list.length > 0;

    for (const item of list) {
      const li = document.createElement('li');

      const info = document.createElement('div');
      info.className = 'info';
      const keyEl = document.createElement('div');
      keyEl.className = 'key';
      keyEl.textContent = '/' + item.key;
      const origEl = document.createElement('div');
      origEl.className = 'orig';
      origEl.textContent = item.originalUrl;
      origEl.title = item.originalUrl;
      info.append(keyEl, origEl);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'secondary';
      btn.textContent = '조회수';
      btn.addEventListener('click', () => {
        $('stats-key').value = item.key;
        lookup(item.key);
      });

      li.append(info, btn);
      ul.append(li);
    }
  }

  renderRecent();
</script>
</body>
</html>
